name: CI

on:
  push:
    branches: [main]
    tags:
      - '*'
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

    tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: uv sync --locked --all-extras --dev

      - name: Lancer les tests avec couverture
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-report=json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

      - name: Update Coverage Badge
        if: matrix.python-version == '3.12' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@main

  build:
    name: Build exécutable
    runs-on: ${{ matrix.os }}
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: linkedin-gameinator-windows.exe
          - os: ubuntu-latest
            artifact_name: linkedin-gameinator-linux
          - os: macos-latest
            artifact_name: linkedin-gameinator-macos

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked --dev

      - name: Installer PyInstaller
        run: uv add --dev pyinstaller

      - name: Build de l'exécutable
        run: uv run pyinstaller --onefile --name ${{ matrix.artifact_name }} src/Queens/ui.py

      - name: Upload de l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    name: Publier la release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Publier sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**/*