[project]
name = "linkedin-gameinator"
version = "0.2.0"
description = "Many different ways to resolve the LinkedIn games"

authors = [
    { name = "valentin.giaufer", email = "valentin.giaufer@gmail.com" }
]
requires-python = ">=3.11"
# Runtime dependencies only. Everything else that used to be listed here was a
# transitive dependency already resolved by uv.lock, or a test-only package.
dependencies = [
    "pyswip>=0.3.3",
    "selenium>=4.44.0",
]

[project.scripts]
linkedin-gameinator = "linkedin_gameinator:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pyinstaller>=6.22.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes, I: import order, UP: pyupgrade, B: bugbear,
# SIM: simplifications, C4: comprehensions, RET: return statements, ARG: unused args
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG"]
# Ternaries are not automatically clearer than a short if/else block.
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are requested by name and may be used only for their side effects.
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = false        # mets à true plus tard quand t'es à l'aise
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
]
