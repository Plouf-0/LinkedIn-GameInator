[project]
name = "linkedin-gameinator"
version = "0.1.0"
description = "Many different ways to resolve the LinkedIn games"

authors = [
    { name = "valentin.giaufer", email = "valentin.giaufer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "attrs==26.1.0",
    "certifi==2026.5.20",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "colorama==0.4.6",
    "coverage==7.14.1",
    "h11==0.16.0",
    "idna==3.16",
    "iniconfig==2.3.0",
    "outcome==1.3.0.post0",
    "packaging==26.2",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pygments==2.20.0",
    "pysocks==1.7.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "requests==2.34.2",
    "selenium==4.44.0",
    "setuptools==82.0.1",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "trio==0.33.0",
    "trio-websocket==0.12.2",
    "typing-extensions==4.15.0",
    "undetected-chromedriver==3.5.5",
    "urllib3==2.7.0",
    "websocket-client==1.9.0",
    "websockets==16.0",
    "wsproto==1.3.2",
]

[project.scripts]
linkedin-gameinator = "linkedin_gameinator:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # erreurs, imports, upgrades, bugbear

[tool.mypy]
python_version = "3.11"
strict = false        # mets à true plus tard quand t'es à l'aise
ignore_missing_imports = true